<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>VIA - Primeiro acesso</title>
<style>
:root{--bg:#000;--surface:#08091d;--surface2:#10134a;--line:#292d75;--text:#fff;--muted:#a7cbed;--accent:#4eaff7;--red:#ff6b73;--radius:13px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:32px;display:grid;gap:14px}
h1{font-size:20px;margin:0}
p{margin:0;color:var(--muted);font-size:13px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
select{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:11px 12px;font-size:14px}
select:focus{outline:2px solid var(--accent);outline-offset:2px}
button{display:flex;align-items:center;justify-content:center;width:100%;margin-top:6px;background:var(--accent);border:0;color:#06201b;font-weight:650;border-radius:9px;padding:11px 12px;font-size:14px;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.error{color:var(--red);font-size:12px;min-height:1em}
</style>
</head>
<body>
<main class="card">
  <h1>Bem-vindo, {{ name }}</h1>
  <p>Para começar, escolha o estado e o município que você acompanha. O mapa do painel abre centrado nele. Você só faz isso uma vez e pode trocar depois em Configurações.</p>
  <div><label for="uf">Estado</label><select id="uf"><option value="">Carregando…</option></select></div>
  <div><label for="mun">Município</label><select id="mun" disabled><option value="">Escolha o estado primeiro</option></select></div>
  <p class="error" id="err" role="alert"></p>
  <button type="button" id="go" disabled>Continuar</button>
</main>
<script>
(()=>{const NEXT={{ next_url|tojson }};const uf=document.getElementById('uf'),mun=document.getElementById('mun'),go=document.getElementById('go'),err=document.getElementById('err');
const opt=(v,t)=>{const o=document.createElement('option');o.value=v;o.textContent=t;return o};
async function j(u,o){const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Não foi possível carregar agora.');return d}
(async()=>{try{const list=await j('/api/geo/estados');uf.replaceChildren(opt('','Estado'));list.forEach(s=>uf.appendChild(opt(s.sigla,s.nome)))}catch(e){err.textContent=e.message}})();
uf.addEventListener('change',async()=>{go.disabled=true;mun.disabled=true;mun.replaceChildren(opt('','Município'));if(!uf.value)return;
  try{(await j('/api/geo/municipios?uf='+encodeURIComponent(uf.value))).forEach(m=>mun.appendChild(opt(m.id,m.nome)));mun.disabled=false}catch(e){err.textContent=e.message}});
mun.addEventListener('change',()=>{go.disabled=!mun.value});
go.addEventListener('click',async()=>{go.disabled=true;err.textContent='';
  try{const r=await j('/api/me/municipio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:mun.value})});
    try{localStorage.setItem('via-municipio',JSON.stringify(r))}catch(_){}location.href=NEXT}catch(e){err.textContent=e.message;go.disabled=false}});})();
</script>
</body>
</html>
